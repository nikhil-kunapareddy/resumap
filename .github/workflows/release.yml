name: Release

# Pushing a tag like v0.2.0 builds the double-click app for Apple Silicon and
# Intel, smoke-tests each disk image, and publishes them on a GitHub release.
# A pull request that touches the build runs the same build and smoke test,
# and keeps the images as workflow artifacts instead of releasing them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "backend/resumap/launcher.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      # Build exactly what uv.lock pins; fail rather than re-resolve.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build Resumap.app, its .dmg and .zip
        run: ./packaging/build_macos.sh

      - name: Smoke-test the disk image
        run: ./packaging/smoke_test.sh dist/Resumap-*-macos-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: resumap-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Resumap ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release_notes.md \
            --generate-notes \
            --verify-tag
